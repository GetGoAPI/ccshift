name: Release

# 推 v 开头的标签（如 v1.0.1）：打包 Windows + macOS，并发布到 GitHub Releases。
# 在 Actions 页面手动运行：只打包，安装包在本次运行的 Artifacts 里下载，不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            rust-targets: ""
          # 一个 .app 同时含 Apple 芯片和 Intel 两份代码
          - name: macOS universal
            os: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # rust-toolchain.toml 是编译器版本的唯一来源
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 打标签发布时，安装包版本号跟标签走（v1.2.3 → 1.2.3），不用每次手改配置
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          ' "$version"
          echo "Version: $version"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles msi

      # 没有苹果开发者证书：用 ad-hoc 签名（"-"）。不签名的话 Apple 芯片的 Mac 根本打不开；
      # ad-hoc 签名后客户第一次打开需要右键「打开」或执行 xattr，见 CCSHIFT.md。
      # Tauri 自带的 DMG 在 CI 上不稳定，只打 .app，DMG 下一步用 hdiutil 做。
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Collect assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'No .msi produced' }
          Copy-Item $msi.FullName "release-assets/ccshift-$version-Windows-x64.msi"
          Get-ChildItem release-assets

      - name: Collect assets (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 出错时把原因写成注解：不登录 GitHub 也能在运行页面上看到
          fail() { echo "::error title=macOS packaging::$*"; exit 1; }
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          app=$(find src-tauri/target -type d -name "*.app" -path "*/bundle/macos/*" -prune 2>/dev/null | head -1 || true)
          if [ -z "$app" ]; then
            fail "No .app found. Bundles: $(find src-tauri/target -maxdepth 5 -type d -name bundle 2>/dev/null | xargs echo)"
          fi
          echo "App: $app"
          # 确认两种芯片都在
          info=$(lipo -info "$app/Contents/MacOS/"* 2>&1 || true)
          echo "$info"
          case "$info" in *x86_64*arm64*|*arm64*x86_64*) ;; *) fail "Not a universal binary: $info" ;; esac
          mkdir -p release-assets

          # zip 先做：DMG 失败时至少还有它
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/ccshift-$version-macOS-universal.zip"

          # DMG：打开后把 ccshift 拖进「应用程序」。GitHub 的 Mac 机器上 hdiutil
          # 偶尔报 "Resource busy"，重试几次
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto "$app" "$stage/$(basename "$app")"
          ln -s /Applications "$stage/Applications"
          dmg="release-assets/ccshift-$version-macOS-universal.dmg"
          for attempt in 1 2 3 4 5; do
            if out=$(hdiutil create -volname ccshift -srcfolder "$stage" -ov -format UDZO "$dmg" 2>&1); then
              echo "$out"; break
            fi
            echo "hdiutil attempt $attempt failed: $out"
            [ "$attempt" = 5 ] && echo "::warning title=DMG::DMG creation failed, only the zip is published: $out"
            sleep $((attempt * 5))
          done
          ls -lh release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccshift-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # 一个平台失败也发布另一个平台的安装包
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: |
            ## 下载

            | 系统 | 文件 |
            | --- | --- |
            | Windows 10 / 11 | `ccshift-*-Windows-x64.msi` |
            | macOS（Apple 芯片和 Intel 通用） | `ccshift-*-macOS-universal.dmg` |

            **macOS 首次打开**：如提示「已损坏」或「无法验证开发者」，打开「终端」执行下面一行后再打开：

            ```
            xattr -cr /Applications/ccshift.app
            ```
